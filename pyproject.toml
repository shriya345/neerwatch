[project]
name = "neerwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "rasterio>=1.4,<2",
    "shapely>=2,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "torch>=2.5,<3",
    "joblib>=1.4,<2",
    "reportlab>=4,<6",
    "matplotlib>=3.9,<4",
    "Pillow>=11,<14",
    "pyproj>=3.6,<4",
    "netCDF4>=1.7,<2"
]

[tool.vercel]
entrypoint = "backend.main:app"
