<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-label="Implemented NEERWATCH architecture"><rect width="900" height="610" fill="#f7f9f8"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#51625b"/></marker></defs><text x="25" y="32" font-family="Arial" font-size="22" font-weight="bold">NEERWATCH — exactly 46 Karnataka reservoirs</text><rect x="25" y="65" width="410" height="85" rx="10" fill="#e5f2eb" stroke="#879b8f"/><text x="40" y="97" font-family="Arial" font-size="18" font-weight="bold">Sentinel-2 observations</text><text x="40" y="124" font-family="Arial" font-size="13">Existing processing + quality checks</text><path d="M230,150 L230,187" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="25" y="190" width="410" height="85" rx="10" fill="#e5f2eb" stroke="#879b8f"/><text x="40" y="222" font-family="Arial" font-size="18" font-weight="bold">Chlorophyll-a + observed FAI</text><text x="40" y="249" font-family="Arial" font-size="13">Cached outputs / validated snapshot</text><path d="M230,275 L230,312" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="25" y="315" width="410" height="85" rx="10" fill="#e5f2eb" stroke="#879b8f"/><text x="40" y="347" font-family="Arial" font-size="18" font-weight="bold">Monitoring API</text><text x="40" y="374" font-family="Arial" font-size="13">Existing FastAPI routes</text><path d="M230,400 L230,437" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="25" y="440" width="410" height="85" rx="10" fill="#e5f2eb" stroke="#879b8f"/><text x="40" y="472" font-family="Arial" font-size="18" font-weight="bold">Operational dashboard</text><text x="40" y="499" font-family="Arial" font-size="13">Search, monitoring, PDF / CSV</text><rect x="465" y="65" width="410" height="85" rx="10" fill="#fff0d5" stroke="#879b8f"/><text x="480" y="97" font-family="Arial" font-size="18" font-weight="bold">Reviewed CyFi satellite crops</text><text x="480" y="124" font-family="Arial" font-size="13">Frozen inputs for existing reservoirs</text><path d="M670,150 L670,187" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="465" y="190" width="410" height="85" rx="10" fill="#fff0d5" stroke="#879b8f"/><text x="480" y="222" font-family="Arial" font-size="18" font-weight="bold">Original CyFi features + 5 models</text><text x="480" y="249" font-family="Arial" font-size="13">Pretrained LightGBM regression</text><path d="M670,275 L670,312" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="465" y="315" width="410" height="85" rx="10" fill="#fff0d5" stroke="#879b8f"/><text x="480" y="347" font-family="Arial" font-size="18" font-weight="bold">Experimental API + cache</text><text x="480" y="374" font-family="Arial" font-size="13">3 outputs; rejected/missing inputs withheld</text><path d="M670,400 L670,437" stroke="#51625b" fill="none" marker-end="url(#a)"/><rect x="465" y="440" width="410" height="85" rx="10" fill="#fff0d5" stroke="#879b8f"/><text x="480" y="472" font-family="Arial" font-size="18" font-weight="bold">Experimental ML Estimates</text><text x="480" y="499" font-family="Arial" font-size="13">Research only; no alert/report connection</text><text x="25" y="565" font-family="Arial" font-size="14">Separate historical FAI acquisition continues. RF preparation code exists; forecasting is not trained.</text><text x="25" y="590" font-family="Arial" font-size="14">CyFi estimates have no established Karnataka field validation. No health categories are assigned.</text></svg>